apiVersion: v1
kind: Secret
metadata:
  name: myfit-runtime
  namespace: myfit
type: Opaque
stringData:
  DATABASE_URL: "mysql://CHANGE_ME:CHANGE_ME@mariadb.example:3306/myfit"
  MONGODB_URL: "mongodb://CHANGE_ME:CHANGE_ME@mongodb.example:27017"
  REDIS_URL: "redis://redis.example:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: myfit-jwt-keypair
  namespace: myfit
type: Opaque
stringData:
  jwt-public.pem: |-
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_THE_RS256_PUBLIC_KEY
    -----END PUBLIC KEY-----
  jwt-private.pem: |-
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_THE_MATCHING_RS256_PRIVATE_KEY
    -----END PRIVATE KEY-----
