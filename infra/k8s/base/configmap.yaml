apiVersion: v1
kind: ConfigMap
metadata:
  name: myfit-runtime
  namespace: myfit
data:
  HTTP_BIND_ADDRESS: "0.0.0.0:8080"
  GRPC_BIND_ADDRESS: "0.0.0.0:50051"
  RUST_LOG: "info"
  APP_ENV: "production"
  JWT_PUBLIC_KEY_PATH: "/run/secrets/jwt/jwt-public.pem"
  JWT_PRIVATE_KEY_PATH: "/run/secrets/jwt/jwt-private.pem"
  JWT_ISSUER: "myfit-auth"
  JWT_AUDIENCE: "myfit-api"
