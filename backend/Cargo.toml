[workspace]
members = ["application", "entity", "migration", "business"]
default-members = ["application"]
resolver = "3"

[workspace.dependencies]
utoipa = { version = "^6.0.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "^10.0.2", features = ["axum"] }
dotenvy = "0.15.7"
tokio = { version = "1.54.1", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }
async-std = { version = "1.13.2", features = ["attributes", "tokio1"] }
sea-orm = "2.0.4"

[profile.release]
opt-level = 3
lto = "thin"         # Melhora o tempo de linkagem e usa menos RAM que o 'fat'

[profile.release.package."*"]
opt-level = 2
