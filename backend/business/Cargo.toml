[package]
name = "business"
version = "0.1.0"
edition = "2024"

[dependencies]
entity = { path = "../entity" }

chrono = { workspace = true }
uuid = {workspace = true}
utoipa = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

bcrypt = "0.19.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
log = "0.4.35"
aws-config = { version = "1.13.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = ["rt-tokio", "rustls"] }
aws-sdk-sqs = { version = "1.119.0", default-features = false, features = ["rt-tokio", "rustls"] }
cloudfront_sign = "0.4.1"
serde_json = "1.0.154"
urlencoding = "2.1.3"
reqwest = { version = "0.13.5", features = ["json", "multipart", "form"] }
image = "0.25.10"
async-trait = "0.1.92"
base64 = "0.23.1"
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"

zeroize = "1.9.1"

[dependencies.sea-orm]
version = "2.0.4"
features = ["debug-print","runtime-tokio-native-tls","sqlx-mysql"]

[dev-dependencies]
tokio = { workspace = true }

[features]
mock = ["sea-orm/mock"]

[[test]]
name = "mock"
required-features = ["mock"]

[[test]]
name = "manual_meal_analysis_tests"
required-features = ["mock"]

