[package]
name = "business"
version = "0.1.0"
edition = "2021"

[dependencies]
entity = { path = "../entity" }

chrono = { workspace = true }
uuid = {workspace = true}
utoipa = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

bcrypt = "0.19.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
log = "0.4.33"
aws-config = { version = "1.10.1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1.140.0", default-features = false, features = ["rt-tokio", "rustls"] }
aws-sdk-sqs = { version = "1.105.0", default-features = false, features = ["rt-tokio", "rustls"] }
cloudfront_sign = "0.4.1"
serde_json = "1.0.151"
urlencoding = "2.1.3"
reqwest = { version = "0.13.5", features = ["json", "multipart", "form"] }
image = "0.25"
async-trait = "0.1"
base64 = "0.23.1"

zeroize = "1.8"

[dependencies.sea-orm]
version = "2.0.3"
features = [
    "debug-print",
    "runtime-tokio-native-tls",
    "sqlx-mysql"
]

[dev-dependencies]
tokio = { workspace = true }

[features]
mock = ["sea-orm/mock"]

[[test]]
name = "mock"
required-features = ["mock"]

[[test]]
name = "manual_meal_analysis_tests"
required-features = ["mock"]

